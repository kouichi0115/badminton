name: さくらのレンタルサーバーに公開

on:
  push:
    branches: [main, ccr-84162cc0-86ujp5]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sakura
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 接続情報の確認
        id: check
        env:
          SERVER: ${{ secrets.SAKURA_FTP_SERVER }}
          USER: ${{ secrets.SAKURA_FTP_USER }}
          PASS: ${{ secrets.SAKURA_FTP_PASSWORD }}
        run: |
          if [ -z "$SERVER" ] || [ -z "$USER" ] || [ -z "$PASS" ]; then
            echo "::notice::さくらの接続情報が未設定のため、自動アップロードは行いません。ビルド済みファイル（badminton-upload-files）をダウンロードして手動でアップロードできます。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      # 手動でアップロードする人のために、ビルド済みファイルを ZIP で残す
      - name: ビルド済みファイルを保存（手動アップロード用）
        uses: actions/upload-artifact@v4
        with:
          name: badminton-upload-files
          path: dist/
          include-hidden-files: true
          retention-days: 30

      - name: さくらへアップロード（SFTP、だめなら FTPS）
        if: steps.check.outputs.ready == 'true'
        env:
          SERVER: ${{ secrets.SAKURA_FTP_SERVER }}
          USER: ${{ secrets.SAKURA_FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.SAKURA_FTP_PASSWORD }}
          DIR: ${{ vars.SAKURA_DIR || 'www/badminton/' }}
        run: |
          sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq lftp > /dev/null
          # よくある入力のずれを直す（前後の空白・改行、https://、末尾の /、アカウント名に付いたドメイン）
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          SERVER=$(trim "$SERVER" | sed -e 's#^[a-z]*://##' -e 's#/.*$##')
          USER=$(trim "$USER" | sed -e 's/@.*$//' -e 's/\.sakura\.ne\.jp$//')
          export LFTP_PASSWORD=$(printf '%s' "$LFTP_PASSWORD" | tr -d '\r\n')
          # 値そのものは出さず、形だけ表示して点検できるようにする
          echo "サーバー名: ${#SERVER}文字 / sakura.ne.jp で終わる: $([[ $SERVER == *.sakura.ne.jp ]] && echo はい || echo いいえ)"
          echo "アカウント名: ${#USER}文字 / サーバー名の先頭と一致: $([[ $SERVER == "$USER".* ]] && echo はい || echo いいえ)"
          echo "パスワード: ${#LFTP_PASSWORD}文字"
          common="set net:max-retries 1; set net:timeout 30; set sftp:auto-confirm yes; set ssl:verify-certificate yes"
          upload() {
            lftp -c "$common; ${1:+$1;} open --env-password -u \"$USER\" $2; mkdir -p -f \"$DIR\"; mirror -R --verbose=1 --no-perms ./dist/ \"$DIR\""
          }
          echo "--- SFTP で接続します"
          if upload "" "sftp://$SERVER"; then
            echo "SFTP でアップロードしました"
            exit 0
          fi
          echo "--- FTPS で接続します"
          if upload "set ftp:ssl-force true; set ftp:ssl-protect-data true" "ftp://$SERVER"; then
            echo "FTPS でアップロードしました"
            exit 0
          fi
          echo "::error::さくらに接続できませんでした。アカウント名とサーバパスワードを確認してください。"
          exit 1
