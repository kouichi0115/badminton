name: さくらのレンタルサーバーに公開

on:
  push:
    branches: [main, ccr-84162cc0-86ujp5]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sakura
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 接続情報の確認
        id: check
        env:
          SERVER: ${{ secrets.SAKURA_FTP_SERVER }}
          USER: ${{ secrets.SAKURA_FTP_USER }}
          PASS: ${{ secrets.SAKURA_FTP_PASSWORD }}
        run: |
          if [ -z "$SERVER" ] || [ -z "$USER" ] || [ -z "$PASS" ]; then
            echo "::notice::さくらの接続情報（SAKURA_FTP_SERVER / SAKURA_FTP_USER / SAKURA_FTP_PASSWORD）が未設定のため、アップロードをスキップしました。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.check.outputs.ready == 'true'
        run: npm ci
      - if: steps.check.outputs.ready == 'true'
        run: npm test
      - if: steps.check.outputs.ready == 'true'
        run: npm run build

      - name: さくらへアップロード（SFTP、だめなら FTPS）
        if: steps.check.outputs.ready == 'true'
        env:
          SERVER: ${{ secrets.SAKURA_FTP_SERVER }}
          USER: ${{ secrets.SAKURA_FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.SAKURA_FTP_PASSWORD }}
          DIR: ${{ vars.SAKURA_DIR || 'www/badminton/' }}
        run: |
          sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq lftp > /dev/null
          common="set net:max-retries 2; set net:timeout 30; set sftp:auto-confirm yes; set ssl:verify-certificate yes"
          upload() {
            lftp -c "$common; ${1:+$1;} open --env-password -u \"$USER\" $2; mkdir -p -f \"$DIR\"; mirror -R --verbose=1 --no-perms ./dist/ \"$DIR\""
          }
          if upload "" "sftp://$SERVER"; then
            echo "SFTP でアップロードしました"
          elif upload "set ftp:ssl-force true; set ftp:ssl-protect-data true" "ftp://$SERVER"; then
            echo "FTPS でアップロードしました"
          else
            echo "::error::さくらに接続できませんでした。SAKURA_FTP_SERVER / SAKURA_FTP_USER / SAKURA_FTP_PASSWORD の値と、さくらのコントロールパネルの国外IPアドレスからのアクセス制限の設定を確認してください。"
            exit 1
          fi
